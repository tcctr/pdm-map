<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PDM Sintra-Cascais</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="map"></div>

<!-- Top bar -->
<div id="topbar">
  <div id="muni-picker">
    <button id="muni-picker-btn" onclick="toggleMuniDropdown()">
      <span id="muni-picker-label">Sintra</span>
      <span id="muni-picker-chevron">&#9660;</span>
    </button>
    <div id="muni-dropdown">
      <div class="muni-option selected" data-muni="sintra" onclick="pickMunicipality('sintra')">
        <span class="muni-option-check">&#10003;</span> Sintra
      </div>
      <div class="muni-option" data-muni="cascais" onclick="pickMunicipality('cascais')">
        <span class="muni-option-check">&#10003;</span> Cascais
      </div>
    </div>
  </div>
  <div id="search-wrap">
    <input id="search-input" type="text" placeholder="Pesquisar morada…" autocomplete="off" />
    <div id="search-results"></div>
  </div>
</div>

<!-- Status chips -->
<div id="statusbar">
  <div class="status-chip chip-loading" id="chip-gps">
    <div class="dot"></div><span>GPS</span>
  </div>
  <div class="status-chip chip-loading" id="chip-sintra">
    <div class="dot"></div><span>Sintra</span>
  </div>
  <div class="status-chip chip-loading" id="chip-cascais" style="display:none">
    <div class="dot"></div><span>Cascais</span>
  </div>
  <div class="status-chip chip-loading" id="chip-overlay">
    <div class="dot"></div><span>Solo…</span>
  </div>
</div>

<!-- Layers trigger button -->
<button id="layers-btn" onclick="toggleLayersSheet()">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
  </svg>
  <span id="layers-btn-label">Zoneamento</span>
</button>

<!-- Layers backdrop -->
<div id="layers-backdrop" onclick="closeLayersSheet()"></div>

<!-- Layers bottom sheet -->
<div id="layers-sheet">
  <div id="layers-handle"></div>
  <div id="layers-title">Camadas</div>
  <div id="overlay-body"></div>
</div>


<!-- Detail bottom sheet -->
<div id="detail-panel">
  <div id="detail-handle"></div>
  <button id="detail-close" onclick="closeDetail()">&#x2715;</button>
  <div id="detail-content">
    <div id="detail-cat-badge">
      <div class="swatch" id="detail-swatch"></div>
      <span id="detail-cat-code"></span>
    </div>
    <div id="detail-title"></div>
    <div id="detail-sub"></div>
    <div id="detail-rows"></div>
  </div>
</div>

<!-- Cache date indicator -->
<div id="cache-date"></div>

<!-- Locate button -->
<button id="locate-btn" onclick="locateUser()" title="Centrar no GPS">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
  </svg>
</button>

<!-- SVG hatch pattern definitions for overlay layers -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <pattern id="hatch-ran" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="rgba(180,120,50,0.22)"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#b47832" stroke-width="3" stroke-opacity="0.7"/>
    </pattern>
    <pattern id="hatch-ren" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="rgba(30,120,60,0.1)"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#1a9850" stroke-width="2" stroke-opacity="0.55"/>
    </pattern>
    <pattern id="hatch-risk-red" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="rgba(220,53,69,0.1)"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#dc3545" stroke-width="2" stroke-opacity="0.55"/>
    </pattern>
    <pattern id="hatch-risk-orange" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="rgba(224,120,0,0.1)"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#e07800" stroke-width="2" stroke-opacity="0.55"/>
    </pattern>
  </defs>
</svg>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Esri Leaflet (for Cascais dynamic map layer + identify) -->
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>

<script type="module">
import { URBAN_COLORS, RURAL_COLORS, CASCAIS_COLORS, FIRE_COLORS, MUNICIPALITIES, OVERLAY_DEFS, MIN_DATA_ZOOM, RETRY_DELAYS, SINTRA_BASE, CASCAIS_BASE, REN_RAN_BASE, CONDICIONANTES_BASE } from './js/config.js';

// ============================================================
// CONSTANTS & CONFIG
// ============================================================

const DEFAULT_CENTER = [38.75, -9.42];
const DEFAULT_ZOOM = 13;

// ============================================================
// MAP SETUP
// ============================================================

const map = L.map('map', {
  center: DEFAULT_CENTER,
  zoom: DEFAULT_ZOOM,
  zoomControl: false,
  attributionControl: false,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);

// Attribution bottom-left, small
L.control.attribution({ position: 'bottomleft', prefix: false }).addTo(map);

// Zoom control bottom-right above locate button

// SVG renderer with extra padding so polygons don't get clipped at high zoom
const renderer = L.svg({ padding: 1 });
// Canvas renderer for overlay layers — much faster for many polygons
const overlayRenderer = L.canvas({ padding: 0.5 });

// Layer groups
const urbanLayer   = L.layerGroup().addTo(map);
const ruralLayer   = L.layerGroup().addTo(map);
const cascaisLayer = L.layerGroup().addTo(map);


// ============================================================
// DATA HELPERS — cache-first with live ArcGIS fallback
// ============================================================

let cacheMetaDate = null;   // formatted date string from sync-metadata.json
let liveFallbackCount = 0;  // incremented each time a layer falls back to live

function updateCacheDateIndicator() {
  const el = document.getElementById('cache-date');
  if (!el || !cacheMetaDate) return;
  el.textContent = liveFallbackCount > 0
    ? `Dados: ${cacheMetaDate} (alguns em direto)`
    : `Dados: ${cacheMetaDate}`;
}

async function loadCacheMetadata() {
  try {
    const res = await fetch('/data/sync-metadata.json', { signal: AbortSignal.timeout(8000) });
    if (!res.ok) return;
    const meta = await res.json();
    if (meta.lastRun) {
      const d = new Date(meta.lastRun);
      cacheMetaDate = d.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
      updateCacheDateIndicator();
    }
  } catch {
    // silently ignore — indicator stays hidden
  }
}

// ── Live ArcGIS query helpers ─────────────────────────────────

async function fetchGeoJSONPage(url, offset, count = 1000) {
  const sep = url.includes('?') ? '&' : '?';
  const full = `${url}${sep}resultOffset=${offset}&resultRecordCount=${count}&f=geojson`;
  const res = await fetch(full, { signal: AbortSignal.timeout(30000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function fetchAllFeatures(baseQueryUrl) {
  const features = [];
  let offset = 0;
  const pageSize = 1000;
  while (true) {
    const data = await fetchGeoJSONPage(baseQueryUrl, offset, pageSize);
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    const batch = data.features || [];
    features.push(...batch);
    if (!data.exceededTransferLimit || batch.length === 0) break;
    offset += batch.length;
  }
  return features;
}

// ── Unified loader: cache first, live ArcGIS fallback ─────────
// Returns { features: [...], fromCache: bool } or null if both fail.

async function loadLayerData(cachedFile, fallbackUrl) {
  // 1. Try local cache
  if (cachedFile) {
    try {
      const res = await fetch(`/data/${cachedFile}`, { signal: AbortSignal.timeout(15000) });
      if (res.ok) {
        const data = await res.json();
        const features = data.features || [];
        if (features.length > 0) return { features, fromCache: true };
        console.warn(`[cache] ${cachedFile} returned 0 features — falling back to live`);
      } else {
        console.warn(`[cache] ${cachedFile} → HTTP ${res.status} — falling back to live`);
      }
    } catch (e) {
      console.warn(`[cache] ${cachedFile} failed (${e.message}) — falling back to live`);
    }
  }

  // 2. Try live ArcGIS endpoint
  if (fallbackUrl) {
    try {
      const features = await fetchAllFeatures(fallbackUrl);
      if (features.length > 0) {
        liveFallbackCount++;
        updateCacheDateIndicator();
        return { features, fromCache: false };
      }
      console.error(`[live] ${fallbackUrl} returned 0 features`);
    } catch (e) {
      console.error(`[live] ${fallbackUrl} failed:`, e.message);
    }
  }

  // 3. Both failed
  return null;
}

// ============================================================
// STYLE HELPERS
// ============================================================

function makeStyle(fill, opacity = 0.42) {
  return {
    fillColor: fill,
    fillOpacity: opacity,
    color: fill,
    weight: 1,
    opacity: 0.75,
  };
}

function getUrbanStyle(props) {
  const cat = props.CAT || '';
  const cfg = URBAN_COLORS[cat];
  return makeStyle(cfg ? cfg.fill : '#888888');
}

function getRuralStyle(props) {
  const cat = props.Ord_Categ || '';
  const cfg = RURAL_COLORS[cat];
  return makeStyle(cfg ? cfg.fill : '#888888');
}

// ============================================================
// DETAIL PANEL
// ============================================================

function showDetail(props, colorCfg, codeLabel) {
  const panel = document.getElementById('detail-panel');

  document.getElementById('detail-swatch').style.background = colorCfg.fill;
  document.getElementById('detail-cat-badge').style.background = colorCfg.fill + '22';
  document.getElementById('detail-cat-badge').style.color = colorCfg.fill;
  document.getElementById('detail-cat-code').textContent = codeLabel;

  document.getElementById('detail-title').textContent =
    props.Descricao || props.Categoria || colorCfg.label || codeLabel;
  document.getElementById('detail-sub').textContent =
    props.Subcategor && props.Subcategor !== props.Categoria ? props.Subcategor : '';

  const rowsEl = document.getElementById('detail-rows');
  let html = '';

  // ── Metadata row ──
  const area = props.area_ha || props.Area_Ha;
  const metaItems = [];
  if (area) metaItems.push(`<strong>\u00c1rea:</strong> ${parseFloat(area).toFixed(2)} ha`);
  if (props.Classe) metaItems.push(`<strong>Classe:</strong> ${props.Classe}`);
  if (metaItems.length) {
    html += `<div class="detail-row" style="margin-bottom:14px"><div class="detail-row-value" style="color:rgba(255,255,255,0.5);font-size:12px">${metaItems.join(' &nbsp;·&nbsp; ')}</div></div>`;
  }

  // ── Document buttons (hidden for now) ──
  // const docs = [
  //   { label: 'Regulamento', url: props.Regulamento, page: props.Pag_Regulamento },
  //   { label: 'Guião',       url: props.Guiao,        page: props.Pag_Guiao },
  //   { label: 'Relatório',   url: props.Relatorio,    page: props.Pag_relatorio },
  // ].filter(d => d.url);

  rowsEl.innerHTML = html;
  panel.classList.add('open');
  document.getElementById('layers-btn').style.bottom = (panel.offsetHeight + 12) + 'px';
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('layers-btn').style.bottom = '';
}

// Swipe down to close
let touchStartY = 0;
document.getElementById('detail-panel').addEventListener('touchstart', e => {
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.getElementById('detail-panel').addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - touchStartY > 60) closeDetail();
}, { passive: true });

// ============================================================
// LAYER LOADING
// ============================================================

function setChip(id, state, text) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'status-chip chip-' + state;
  el.innerHTML = `<div class="dot"></div><span>${text}</span>`;
}

async function loadSintraUrban() {
  sintraStatus.urban = 'loading'; updateSintraChip();
  const fallbackUrl = `${SINTRA_BASE}/55/query?where=1%3D1&outFields=CAT%2CDescricao%2CRegulamento%2CPag_Regulamento%2CGuiao%2CPag_Guiao%2CRelatorio%2CPag_relatorio%2Carea_ha&outSR=4326`;
  const result = await loadLayerData('sintra-urban.geojson', fallbackUrl);
  if (!result) {
    sintraStatus.urban = 'error'; sintraStatus.urbanText = 'erro';
    updateSintraChip();
    return;
  }
  L.geoJSON({ type: 'FeatureCollection', features: result.features }, {
    renderer,
    style: f => getUrbanStyle(f.properties),
    onEachFeature(feature, layer) {
      layer.on('click', e => {
        L.DomEvent.stopPropagation(e);
        const p = feature.properties;
        const cat = p.CAT || '';
        const cfg = URBAN_COLORS[cat] || { fill: '#888', label: cat };
        showDetail(p, cfg, cat + (cfg.label ? ' — ' + cfg.label : ''));
      });
    }
  }).addTo(urbanLayer);
  sintraStatus.urban = 'ok'; sintraStatus.urbanText = `Urbano (${result.features.length})`;
  updateSintraChip();
}

async function loadSintraRural() {
  sintraStatus.rural = 'loading'; updateSintraChip();
  const fallbackUrl = `${SINTRA_BASE}/54/query?where=1%3D1&outFields=Ord_Categ%2CDescricao%2CRegulamento%2CPag_Regulamento%2CGuiao%2CPag_Guiao%2CRelatorio%2CPag_relatorio%2CArea_Ha&outSR=4326`;
  const result = await loadLayerData('sintra-rural.geojson', fallbackUrl);
  if (!result) {
    sintraStatus.rural = 'error'; sintraStatus.ruralText = 'erro';
    updateSintraChip();
    return;
  }
  L.geoJSON({ type: 'FeatureCollection', features: result.features }, {
    renderer,
    style: f => getRuralStyle(f.properties),
    onEachFeature(feature, layer) {
      layer.on('click', e => {
        L.DomEvent.stopPropagation(e);
        const p = feature.properties;
        const cat = p.Ord_Categ || '';
        const cfg = RURAL_COLORS[cat] || { fill: '#888', label: cat };
        showDetail(p, cfg, cat + (cfg.label ? ' — ' + cfg.label : ''));
      });
    }
  }).addTo(ruralLayer);
  sintraStatus.rural = 'ok'; sintraStatus.ruralText = `Rústico (${result.features.length})`;
  updateSintraChip();
}

// Cascais: AML server blocks geometry export — use dynamic map tiles + identify on click
let cascaisReady = false;

function loadCascais(attempt = 0) {
  cascaisLayer.clearLayers();
  setChip('chip-cascais', 'loading', 'Cascais…');
  try {
    const layer = L.esri.dynamicMapLayer({ url: CASCAIS_BASE, layers: [2], opacity: 0.55, maxZoom: 17 });
    layer.addTo(cascaisLayer);
    layer.once('load', () => { cascaisReady = true; setChipLoaded('chip-cascais', 'ok', 'Cascais'); updateLayerVisibility(); updateZoningOverlayChip(); });
    layer.once('loaderror', () => {
      setChip('chip-cascais', 'error', 'Cascais: erro');
      if (attempt < RETRY_DELAYS.length) setTimeout(() => loadCascais(attempt + 1), RETRY_DELAYS[attempt]);
    });
    cascaisReady = true;
  } catch (e) {
    console.error('Cascais error:', e);
    setChip('chip-cascais', 'error', 'Cascais: indisponível');
    if (attempt < RETRY_DELAYS.length) setTimeout(() => loadCascais(attempt + 1), RETRY_DELAYS[attempt]);
  }
}

// ============================================================
// GPS TRACKING
// ============================================================

let gpsMarker = null;
let gpsAccuracy = null;
let firstFix = true;

const gpsDotIcon = L.divIcon({
  className: '',
  html: '<div class="gps-dot" style="width:14px;height:14px"></div>',
  iconSize: [14, 14],
  iconAnchor: [7, 7],
});

function onGpsSuccess(pos) {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const acc = pos.coords.accuracy;
  const latlng = [lat, lng];

  if (!gpsMarker) {
    gpsMarker = L.marker(latlng, { icon: gpsDotIcon, zIndexOffset: 500 }).addTo(map);
    gpsAccuracy = L.circle(latlng, { radius: acc, weight: 1, color: '#4299e1', fillColor: '#4299e1', fillOpacity: 0.08 }).addTo(map);
  } else {
    gpsMarker.setLatLng(latlng);
    gpsAccuracy.setLatLng(latlng).setRadius(acc);
  }

  if (firstFix) {
    map.setView(latlng, 15);
    firstFix = false;
    autoDetectMunicipality(lat, lng);
  }

  setChip('chip-gps', 'gps', `GPS \u00b1${Math.round(acc)}m`);
}

async function autoDetectMunicipality(lat, lng) {
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=pt`;
    const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
    const data = await res.json();
    const addr = data.address || {};
    const place = [addr.municipality, addr.city, addr.town, addr.village, addr.county]
      .filter(Boolean).join(' ').toLowerCase();
    if (place.includes('cascais')) selectMunicipality('cascais');
    else if (place.includes('sintra')) selectMunicipality('sintra');
    // else: leave default (sintra)
  } catch {
    // silently ignore — default stays
  }
}

function onGpsError(err) {
  setChip('chip-gps', 'error', 'GPS: ' + (err.code === 1 ? 'bloqueado' : 'erro'));
}

function startGPS() {
  if (!navigator.geolocation) {
    setChip('chip-gps', 'error', 'GPS: N/A');
    return;
  }
  setChip('chip-gps', 'loading', 'GPS…');
  navigator.geolocation.watchPosition(onGpsSuccess, onGpsError, {
    enableHighAccuracy: true,
    maximumAge: 5000,
    timeout: 15000,
  });
}

// ── Keyboard / visual viewport handling ─────────────────────
// When the iOS keyboard opens, shift the search results into the
// visible area by tracking the visual viewport height.
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const keyboardHeight = window.innerHeight - window.visualViewport.height;
    document.getElementById('search-results').style.maxHeight =
      keyboardHeight > 100 ? `${window.visualViewport.height - 120}px` : '';
  });
}

function locateUser() {
  if (gpsMarker) {
    map.setView(gpsMarker.getLatLng(), Math.max(map.getZoom(), 15));
  } else if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      map.setView([pos.coords.latitude, pos.coords.longitude], 15);
    }, onGpsError, { enableHighAccuracy: true, timeout: 10000 });
  }
}

// ============================================================
// LAYER TOGGLES + ZOOM VISIBILITY
// ============================================================

// ── Active layer selection ────────────────────────────────────
let activeLayer = 'zoning';
let activeMunicipality = 'sintra';

// ── Municipality picker ──────────────────────────────────────

function toggleMuniDropdown() {
  const btn = document.getElementById('muni-picker-btn');
  const dd  = document.getElementById('muni-dropdown');
  const open = dd.classList.toggle('open');
  btn.classList.toggle('open', open);
}

function closeMuniDropdown() {
  document.getElementById('muni-dropdown').classList.remove('open');
  document.getElementById('muni-picker-btn').classList.remove('open');
}

function pickMunicipality(muni) {
  closeMuniDropdown();
  selectMunicipality(muni);
}

// Close dropdown when clicking outside
document.addEventListener('click', e => {
  if (!document.getElementById('muni-picker').contains(e.target)) closeMuniDropdown();
});

function selectMunicipality(muni) {
  activeMunicipality = muni;
  // Update picker label and checkmarks
  const cfg = MUNICIPALITIES.find(m => m.id === muni);
  document.getElementById('muni-picker-label').textContent = cfg ? cfg.label : muni;
  if (cfg) map.flyTo(cfg.center, cfg.zoom, { duration: 1.2 });
  document.querySelectorAll('.muni-option').forEach(opt => {
    opt.classList.toggle('selected', opt.dataset.muni === muni);
  });
  // Reset to zoning and clear all overlay cache
  activeLayer = 'zoning';
  for (const def of OVERLAY_DEFS) {
    const st = ovlState[def.id];
    if (st.leafletLayer) { map.removeLayer(st.leafletLayer); st.leafletLayer = null; }
    st.loaded = false; st.loading = false; st.active = false; st.retries = 0;
  }
  // Rebuild layer list and restore map state
  buildOverlayPanel();
  updateLayerVisibility();
  updateLayersBtnLabel('zoning');
  updateZoningOverlayChip();
}

function setOverlayChip(state, text) {
  const el = document.getElementById('chip-overlay');
  if (!el) return;
  el.className = 'status-chip chip-' + state;
  el.innerHTML = `<div class="dot"></div><span>${text}</span>`;
}

function updateZoningOverlayChip() {
  if (activeLayer !== 'zoning') return;
  if (activeMunicipality === 'sintra') {
    const u = sintraStatus.urban, r = sintraStatus.rural;
    if (u === 'loading' || r === 'loading') setOverlayChip('loading', 'Solo\u2026');
    else if (u === 'ok' && r === 'ok')       setOverlayChip('ok', 'Solo');
    else if (u === 'error' && r === 'error') setOverlayChip('error', 'Solo: erro');
    else                                     setOverlayChip('warn', 'Solo');
  } else {
    const cascaisState = chipLoadedState['chip-cascais']?.state;
    if (!cascaisState)              setOverlayChip('loading', 'Solo\u2026');
    else if (cascaisState === 'ok') setOverlayChip('ok', 'Solo');
    else                            setOverlayChip('error', 'Solo: erro');
  }
}

function overlayShortName(def) {
  return def.name.includes('\u2014') ? def.name.split('\u2014')[0].trim() : def.name;
}

function handleLayerSelect(value) {
  activeLayer = value;
  updateLayersBtnLabel(value);
  setTimeout(closeLayersSheet, 180);
  if (value === 'zoning') {
    updateZoningOverlayChip();
    // Deactivate all overlays
    for (const def of OVERLAY_DEFS) {
      ovlState[def.id].active = false;
      if (ovlState[def.id].leafletLayer) map.removeLayer(ovlState[def.id].leafletLayer);
    }
    updateLayerVisibility();
  } else {
    // Hide zoning
    [urbanLayer, ruralLayer, cascaisLayer].forEach(l => map.removeLayer(l));
    // Show overlay chip as loading
    const def = OVERLAY_DEFS.find(d => d.id === value);
    setOverlayChip('loading', overlayShortName(def) + '\u2026');
    // Deactivate all other overlays, activate this one
    for (const def of OVERLAY_DEFS) {
      if (def.id === value) {
        ovlState[def.id].active = true;
        loadOverlay(def.id);
      } else {
        ovlState[def.id].active = false;
        if (ovlState[def.id].leafletLayer) map.removeLayer(ovlState[def.id].leafletLayer);
      }
    }
  }
}

// ── Sintra combined chip logic ──────────────────────────────
const sintraStatus = { urban: 'loading', urbanText: '', rural: 'loading', ruralText: '' };

function updateSintraChip() {
  const zoomed = map.getZoom() >= MIN_DATA_ZOOM;
  const on = activeLayer === 'zoning' && activeMunicipality === 'sintra';

  [urbanLayer, ruralLayer].forEach(l => on && zoomed ? map.addLayer(l) : map.removeLayer(l));

  const sintraEl = document.getElementById('chip-sintra');
  if (!sintraEl) return;
  sintraEl.style.display = activeMunicipality === 'sintra' ? '' : 'none';
  if (activeMunicipality !== 'sintra') return;
  if (activeLayer !== 'zoning') return; // overlay active — leave chip as-is
  if (!zoomed) { setChip('chip-sintra', 'warn', 'Sintra: zoom'); return; }

  const u = sintraStatus.urban;
  const r = sintraStatus.rural;

  let state, label;
  if (u === 'loading' || r === 'loading') { state = 'loading'; label = 'Sintra…'; }
  else if (u === 'ok' && r === 'ok')      { state = 'ok';      label = 'Sintra'; }
  else if (u === 'error' && r === 'error'){ state = 'error';   label = 'Sintra'; }
  else                                    { state = 'warn';    label = 'Sintra'; }

  setChip('chip-sintra', state, label);
  updateZoningOverlayChip();
}

// ── Layer visibility ─────────────────────────────────────────
const chipLoadedState = {};

function setChipLoaded(id, state, text) {
  chipLoadedState[id] = { state, text };
  setChip(id, state, text);
}

function updateLayerVisibility() {
  updateSintraChip();

  const zoomed = map.getZoom() >= MIN_DATA_ZOOM;
  const on = activeLayer === 'zoning' && activeMunicipality === 'cascais';
  on && zoomed ? map.addLayer(cascaisLayer) : map.removeLayer(cascaisLayer);

  const cascaisEl = document.getElementById('chip-cascais');
  if (!cascaisEl) return;
  cascaisEl.style.display = activeMunicipality === 'cascais' ? '' : 'none';
  if (activeMunicipality !== 'cascais') return;
  if (activeLayer !== 'zoning') return; // overlay active — leave chip as-is
  if (cascaisEl.classList.contains('chip-loading')) return;
  if (!zoomed) setChip('chip-cascais', 'warn', 'Cascais: zoom');
  else if (chipLoadedState['chip-cascais']) {
    setChip('chip-cascais', chipLoadedState['chip-cascais'].state, chipLoadedState['chip-cascais'].text);
  }
}

map.on('zoomend', updateLayerVisibility);

// ============================================================
// MAP CLICK — close panel, or identify Cascais zone
// ============================================================

map.on('click', e => {
  closeDetail();
  if (activeLayer === 'zoning' && cascaisReady && map.hasLayer(cascaisLayer)) {
    L.esri.identifyFeatures({ url: CASCAIS_BASE })
      .on(map).at(e.latlng).layers('visible:2').tolerance(2)
      .run((err, fc) => {
        if (err || !fc || !fc.features.length) return;
        const p = fc.features[0].properties;
        const cat = p.Categoria || '';
        const cfg = CASCAIS_COLORS[cat] || { fill: '#888888', label: cat };
        showDetail(p, cfg, cat);
      });
  } else if (activeLayer === 'incendio') {
    const def = OVERLAY_DEFS.find(d => d.id === 'incendio');
    L.esri.identifyFeatures({ url: CONDICIONANTES_BASE })
      .on(map).at(e.latlng).layers('visible:371').tolerance(3)
      .run((err, fc) => {
        if (err || !fc || !fc.features.length) return;
        showOverlayDetail(def, fc.features[0].properties);
      });
  }
});

// ============================================================
// ADDRESS SEARCH (Nominatim)
// ============================================================

const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let searchDebounce = null;
let searchMarker = null;

searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  const q = searchInput.value.trim();
  if (q.length < 3) { closeSearch(); return; }
  searchDebounce = setTimeout(() => runSearch(q), 350);
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSearch(); searchInput.blur(); }
});

// Close dropdown when clicking outside
document.addEventListener('click', e => {
  if (!document.getElementById('search-wrap').contains(e.target)) closeSearch();
});

async function runSearch(q) {
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&countrycodes=pt&viewbox=-9.55,38.65,-9.30,38.85&bounded=0`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'pt' } });
    const data = await res.json();
    renderResults(data);
  } catch {
    renderResults([]);
  }
}

function renderResults(items) {
  if (items.length === 0) {
    searchResults.innerHTML = '<div class="search-result-item no-results">Sem resultados</div>';
  } else {
    searchResults.innerHTML = items.map(item =>
      `<div class="search-result-item">${item.display_name}</div>`
    ).join('');
    searchResults.querySelectorAll('.search-result-item').forEach((el, i) => {
      el.addEventListener('click', () => selectResult(items[i]));
    });
  }
  searchResults.classList.add('open');
}

function selectResult(item) {
  closeSearch();
  searchInput.value = item.display_name.split(',')[0];

  const lat = parseFloat(item.lat);
  const lng = parseFloat(item.lon);

  if (searchMarker) searchMarker.remove();
  searchMarker = L.circleMarker([lat, lng], {
    radius: 7,
    color: '#fff',
    weight: 2,
    fillColor: '#f4845f',
    fillOpacity: 1,
  }).addTo(map);

  if (item.boundingbox) {
    const bb = item.boundingbox.map(Number);
    map.fitBounds([[bb[0], bb[2]], [bb[1], bb[3]]], { maxZoom: 17 });
  } else {
    map.setView([lat, lng], 16);
  }
}

function closeSearch() {
  searchResults.classList.remove('open');
  searchResults.innerHTML = '';
}

// ============================================================
// OVERLAY / CONDICIONANTES LAYERS
// ============================================================

// Per-layer runtime state
const ovlState = {};
for (const def of OVERLAY_DEFS) {
  ovlState[def.id] = { active: false, loaded: false, loading: false, leafletLayer: null, retries: 0 };
}

function makeOverlayStyle(def) {
  if (def.hatch) {
    return { fillColor: `url(#${def.hatch})`, fillOpacity: 1, color: def.color, weight: 1.2, opacity: 0.6 };
  }
  return { fillColor: def.color, fillOpacity: def.fillOpacity ?? 0.35, color: def.color, weight: 1, opacity: 0.75 };
}

async function loadOverlay(id) {
  const def = OVERLAY_DEFS.find(d => d.id === id);
  const st = ovlState[id];
  if (st.loaded) { if (st.active) st.leafletLayer.addTo(map); return; }
  if (st.loading) return;
  st.loading = true;
  const spin = document.getElementById('ovl-spin-' + id);
  if (spin) spin.style.display = '';
  try {
    const leafletLayer = L.layerGroup();

    if (def.categorized === 'fire') {
      // Server-rendered tiles — no GeoJSON download, no client lag
      const dynLayer = L.esri.dynamicMapLayer({ url: def.server, layers: [def.layerId], opacity: 0.65 });
      dynLayer.addTo(leafletLayer);
      st.leafletLayer = leafletLayer;
      if (st.active) leafletLayer.addTo(map);
      dynLayer.once('load', () => {
        st.loaded = true; st.loading = false;
        if (spin) spin.style.display = 'none';
        if (activeLayer === id) setOverlayChip('ok', overlayShortName(def));
      });
      dynLayer.on('loaderror', () => {
        st.loading = false; if (spin) spin.style.display = 'none';
        if (activeLayer === id) setOverlayChip('error', overlayShortName(def) + ': erro');
      });
      return; // rest handled via events
    }

    // All other layers: GeoJSON rendered client-side (cache-first, live fallback).
    let cachedFile, fallbackUrl;
    if (def.sintraSource && def.cascaisSource) {
      // RAN: per-municipality source
      const isCascais = activeMunicipality === 'cascais';
      cachedFile  = isCascais ? def.cascaisCachedFile : def.sintraCachedFile;
      const src   = isCascais ? def.cascaisSource     : def.sintraSource;
      fallbackUrl = `${src.server}/${src.layerId}/query?where=1%3D1&outFields=*&outSR=4326&maxAllowableOffset=0.0001`;
    } else {
      cachedFile  = def.cachedFile;
      fallbackUrl = `${def.server}/${def.layerId}/query?where=1%3D1&outFields=*&outSR=4326&maxAllowableOffset=0.0001`;
    }
    const result = await loadLayerData(cachedFile, fallbackUrl);
    if (!result) throw new Error('Both cache and live failed');
    const allFeatures = result.features;
    L.geoJSON({ type: 'FeatureCollection', features: allFeatures }, {
      renderer: def.hatch ? renderer : overlayRenderer,
      style: () => makeOverlayStyle(def),
      filter: f => !!f.geometry,
      onEachFeature(feature, layer) {
        layer.on('click', e => {
          L.DomEvent.stopPropagation(e);
          showOverlayDetail(def, feature.properties);
        });
      },
    }).addTo(leafletLayer);
    st.leafletLayer = leafletLayer;
    st.loaded = true;
    st.loading = false;
    if (spin) spin.style.display = 'none';
    if (st.active) leafletLayer.addTo(map);
    if (activeLayer === id) setOverlayChip('ok', overlayShortName(def) + ' (' + allFeatures.length + ')');
  } catch (e) {
    console.error('Overlay error [' + id + ']:', e);
    st.loading = false;
    if (spin) spin.style.display = 'none';
    if (activeLayer === id) setOverlayChip('error', overlayShortName(def) + ': erro');
    if (st.retries < RETRY_DELAYS.length) {
      const delay = RETRY_DELAYS[st.retries++];
      setTimeout(() => { if (activeLayer === id && !st.loaded) loadOverlay(id); }, delay);
    }
  }
}

function showOverlayDetail(def, props) {
  let fill = def.color;
  let code = def.name;
  if (def.categorized === 'fire') {
    const cl = props.CLASSE || '';
    fill = FIRE_COLORS[cl] || def.color;
    code = cl || def.name;
  }
  showDetail(props, { fill, label: def.name }, code);
}

function openLayersSheet() {
  const btn = document.getElementById('layers-btn');
  const sheet = document.getElementById('layers-sheet');
  const rect = btn.getBoundingClientRect();
  sheet.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
  sheet.classList.add('open');
  document.getElementById('layers-backdrop').classList.add('open');
}

function closeLayersSheet() {
  document.getElementById('layers-sheet').classList.remove('open');
  document.getElementById('layers-backdrop').classList.remove('open');
  document.getElementById('overlay-body').scrollTop = 0;
}

function toggleLayersSheet() {
  const open = document.getElementById('layers-sheet').classList.contains('open');
  open ? closeLayersSheet() : openLayersSheet();
}

function updateLayersBtnLabel(value) {
  const def = OVERLAY_DEFS.find(d => d.id === value);
  document.getElementById('layers-btn-label').textContent = def ? def.name : 'Zoneamento';
}

// Swipe down to close layers sheet
let layersTouchStartY = 0;
document.getElementById('layers-sheet').addEventListener('touchstart', e => {
  layersTouchStartY = e.touches[0].clientY;
}, { passive: true });
document.getElementById('layers-sheet').addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - layersTouchStartY > 60) closeLayersSheet();
}, { passive: true });

function buildOverlayPanel() {
  const body = document.getElementById('overlay-body');
  const visibleDefs = OVERLAY_DEFS.filter(d => d.muni === activeMunicipality || d.muni === 'both');
  const groups = [...new Set(visibleDefs.map(d => d.group))];
  let html = `<label class="overlay-item">
    <input type="radio" name="active-layer" value="zoning" checked onchange="handleLayerSelect('zoning')" />
    <span class="overlay-dot" style="background:linear-gradient(135deg,#e63946 33%,#1a9850 33% 66%,#f4a261 66%)"></span>
    <span class="overlay-name">Qualifica\u00e7\u00e3o do Solo</span>
  </label>`;
  for (const grp of groups) {
    html += `<div class="overlay-group-title">${grp}</div>`;
    for (const def of visibleDefs.filter(d => d.group === grp)) {
      const dotBg = def.hatch
        ? `background:repeating-linear-gradient(45deg,${def.color}66,${def.color}66 2px,transparent 2px,transparent 7px),${def.color}22`
        : `background:${def.color}`;
      html += `<label class="overlay-item">
        <input type="radio" name="active-layer" value="${def.id}" onchange="handleLayerSelect('${def.id}')" />
        <span class="overlay-dot" style="${dotBg}"></span>
        <span class="overlay-name">${def.name}</span>
        <span class="overlay-spinner" id="ovl-spin-${def.id}" style="display:none">&#x21BB;</span>
      </label>`;
    }
  }
  body.innerHTML = html;
}

// ============================================================
// INIT
// ============================================================

buildOverlayPanel();
startGPS();
updateLayerVisibility();
loadSintraUrban();
loadSintraRural();

window.handleLayerSelect  = handleLayerSelect;
</script>
